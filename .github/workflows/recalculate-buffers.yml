name: Recalculate Corridor Buffers

on:
  schedule:
    # Runs at 18:00 UTC (12:00 AM Bangladesh Time)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows running manually from the GitHub UI

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Execute Statistical Engine
        env:
          SUPABASE_URL: ${{https://bgytmaeijghkgrvdckam.supabase.co}}
          SUPABASE_SERVICE_KEY: ${{sb_publishable_oRlKp1xnsuCTsJsAk3OWXQ_nMzbU8Kl}}
        run: |
          python scripts/recompute_buffers.py
